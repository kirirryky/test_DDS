<!DOCTYPE html>
<html lang = "ru">
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content="width=device-width, initial-scale=1.0">
        <title>Добавить транзакцию</title>
        {% load static %}
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="{% static 'css/style.css' %}" rel="stylesheet">
    </head>
    <body class="bg-light">
        <!-- Боковое меню -->
         <nav class="side-nav">
            <a href="{% url 'main_menu' %}" title="На главную">🏠</a>
            <a href="{% url 'directory' %}" title="Справочники">📚</a>
            <a href="{% url 'all_transactions' %}" title="Все транзакции">📊</a>
         </nav>

        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8" col-lg-6>

                    <div class="transaction-form-card">
                        <h3 class="text-center mb-4">Новая транзакция</h3>
                        <form method="post">
                            {% csrf_token %}
                            {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label font-weight-bold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.help_text %}
                                    <small class="form-text text-muted">{{ field.help_text }}</small>
                                {% endif %}
                                {% if field.errors %}
                                    <div class="alert alert-danger mt-2 py-2">
                                        {% for error in field.errors %}
                                            {{ error }}
                                        {% endfor %}
                                    </div>
                                {% endif %}
                            </div>
                            {% endfor %}

                            <button type="submit" class="btn btn-success w-100 mt-3">Сохранить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    <script scr="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
