<div class="col-md-9 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>{{ title }}</h4>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal" data-model="{{ model_name }}" title="Добавить">➕</button>
    </div>
    <div class="card-shadow">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Дата</th>
                        <th>Название</th>
                        <th>Автор</th>
                        <th>Комментарий</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in items %}
                    <tr>
                        <td>{{ item.date|default:"-" }}</td>
                        <td>{{ item.name }}</td>
                        <td>{{ item.creator|default:"-" }}</td>
                        <td>{{ item.comment|default:"-" }}</td>
                        <td>
                            <!-- Кнопка редактировать -->
                             <button class="btn btn-sm btn-outline-primary me-1"
                                     data-bs-toggle="modal" data-bs-target="#editModal"
                                     data-model="{{ model_name }}"
                                     data-id="{{ item.id }}"
                                     data-name="{{ item.name }}"
                                     data-comment="{{ item.comment|default:'' }}"
                                     {% if model_name == 'subcategory' %}data-category="{{ item.catgeory.id }}"{% endif %}
                                     title="Редактировать">
                                    ✏️
                                    </button>
                            
                            <!-- Кнопка удалить -->
                             <button class="btn btn-sm btn-outline-danger"
                                     data-bs-toggle="modal" data-bs-target="#deleteModal"
                                     data-model="{{ model_name }}"
                                     data-id="{{ item.id }}"
                                     data-name="{{ item.name }}"
                                     title="Удалить">
                                    🗑️
                                    </button>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted">{{ empty_message }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
